<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Trainer</title>
<meta name="description" content="Plus und Minus üben. Ruhig, ohne Zeitdruck.">
<link rel="icon" href="favicon.svg?v=5" type="image/svg+xml">
<style>
  :root {
    --color-background-app: #0E141D;
    --color-background-surface: #162232;
    --color-background-surface-raised: #1B2A3C;
    --color-background-surface-soft: #13202E;
    --color-action-primary-bg: #F5F7FA;
    --color-action-primary-text: #101722;
    --color-action-primary-hover-bg: #E5EAF0;
    --color-action-secondary-bg: #1C2A3B;
    --color-action-secondary-hover-bg: #26384E;
    --color-border-subtle: #263648;
    --color-border-focus: #F4E7B1;
    --color-text-primary: #F5F7FA;
    --color-text-secondary: #C5D0DD;
    --color-text-muted: #8FA1B4;
    --color-accent: #9BC8A8;
    --color-accent-soft: #9BC8A826;
    --color-accent-muted: #72987C;
    --color-success-soft: #8ECFA326;
    --color-danger-soft: #E58C8A26;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --radius-md: 0.75rem;
    --radius-pill: 999px;
    --duration-base: 180ms;
    --easing-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--color-background-app);
    color: var(--color-text-primary);
    font-family: system-ui, sans-serif;
    line-height: 1.55;
    padding: var(--space-4);
  }
  main { max-width: 26rem; margin: 0 auto; }
  header { text-align: center; margin-block: var(--space-6); }
  h1 {
    font-size: 1.75rem;
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 var(--space-2);
  }
  h1 svg { color: var(--color-accent); vertical-align: -0.15em; }
  .instruction { margin: 0; color: var(--color-text-secondary); }
  h2 { font-size: 1.125rem; margin: var(--space-6) 0 var(--space-3); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  button {
    font: inherit;
    color: var(--color-text-primary);
    background: var(--color-action-secondary-bg);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-pill);
    min-height: 3rem;
    padding: 0 var(--space-5);
    cursor: pointer;
    transition: background-color var(--duration-base) var(--easing-out);
  }
  button:hover { background: var(--color-action-secondary-hover-bg); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--color-border-focus);
    outline-offset: 2px;
  }
  button[aria-pressed="true"] {
    border-color: var(--color-accent);
    background: var(--color-accent-soft);
  }
  button.primary {
    background: var(--color-action-primary-bg);
    color: var(--color-action-primary-text);
    font-weight: 600;
    border: none;
    width: 100%;
    margin-top: var(--space-6);
  }
  button.primary:hover { background: var(--color-action-primary-hover-bg); }
  .progressbox {
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    margin-top: var(--space-6);
  }
  .progressbox .level-line { margin: 0 0 var(--space-2); }
  .progressbox .level-line strong { font-weight: 600; }
  .progressbox .xp { color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
  .bar {
    height: 0.5rem;
    background: var(--color-background-surface-soft);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .bar .fill { height: 100%; background: var(--color-accent); border-radius: var(--radius-pill); }
  .next-level { color: var(--color-text-muted); font-size: 0.875rem; margin: var(--space-2) 0 var(--space-3); }
  .progressbox button { min-height: 2.75rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: var(--space-2); }
  .progressbox button svg { color: var(--color-accent); }
  .custom-range { margin-top: var(--space-3); display: flex; gap: var(--space-3); align-items: end; }
  .custom-range label { display: block; font-size: 0.875rem; color: var(--color-text-secondary); }
  .custom-range input {
    width: 6rem;
    font: inherit;
    color: var(--color-text-primary);
    background: var(--color-background-surface-soft);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    height: 3rem;
    padding: 0 var(--space-3);
  }
  .form-error { color: var(--color-text-secondary); margin: var(--space-3) 0 0; min-height: 1.5em; }
  .range-note { color: var(--color-text-muted); font-size: 0.875rem; margin: var(--space-3) 0 0; }
  .app-footer {
    margin-top: var(--space-8);
    padding-top: var(--space-5);
    border-top: 1px solid var(--color-border-subtle);
    text-align: center;
  }
  .storage-note { color: var(--color-text-muted); font-size: 0.875rem; margin: 0 0 var(--space-2); }
  .btn-link {
    background: none;
    border: none;
    min-height: 2.75rem;
    padding: var(--space-2) var(--space-3);
    font-size: 0.875rem;
    color: var(--color-text-muted);
    text-decoration: underline;
  }
  .btn-link:hover { background: none; color: var(--color-text-secondary); }
  .reset-status { color: var(--color-text-secondary); font-size: 0.875rem; margin: var(--space-2) 0 0; }
  .reset-status:empty { margin: 0; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
  }
  .stats {
    color: var(--color-text-secondary);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }
  .toolbar button { min-height: 2.75rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: var(--space-2); }
  .problem {
    text-align: center;
    font-size: 2.125rem;
    line-height: 1.2;
    letter-spacing: -0.015em;
    margin: 0 0 var(--space-5);
    font-variant-numeric: tabular-nums;
  }
  .slots { display: flex; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-3); }
  .slot {
    width: 3rem;
    height: 3.5rem;
    display: grid;
    place-items: center;
    font-size: 1.75rem;
    font-variant-numeric: tabular-nums;
    background: var(--color-background-surface-soft);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
  }
  .slot.ok { background: var(--color-success-soft); border-color: var(--color-accent); }
  .slot.wrong { background: var(--color-danger-soft); }
  .advisory { text-align: center; color: var(--color-text-muted); font-size: 0.875rem; margin: 0 0 var(--space-4); }
  .hint-row { display: flex; justify-content: center; margin-bottom: var(--space-4); }
  .hint-row button { min-height: 2.75rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: var(--space-2); }
  .hint-row button svg { color: var(--color-accent); }
  .hint {
    margin: 0 0 var(--space-5);
    padding: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
  }
  .hint:empty { margin: 0; padding: 0; border: none; }
  .hint-title { margin: 0; font-weight: 600; }
  .hint-steps {
    list-style: none;
    margin: var(--space-3) 0 0;
    padding: 0;
    display: grid;
    gap: var(--space-2);
    font-size: 1.125rem;
    font-variant-numeric: tabular-nums;
  }
  .hint-note { margin: var(--space-3) 0 0; color: var(--color-text-secondary); font-size: 0.875rem; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
    max-width: 18rem;
    margin: 0 auto;
  }
  .keypad button {
    min-height: 3rem;
    font-size: 1.375rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    background: var(--color-background-surface-raised);
  }
  .keypad button:hover { background: var(--color-action-secondary-hover-bg); }
  .feedback {
    margin: var(--space-5) 0 0;
    padding: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
    text-align: center;
    min-height: 3.5rem;
  }
  .feedback:empty { visibility: hidden; }
  .reward {
    margin: var(--space-3) 0 0;
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    background: var(--color-accent-soft);
    color: var(--color-text-secondary);
    font-size: 0.875rem;
    text-align: center;
  }
  .reward p { margin: 0; }
  .proposal {
    margin: var(--space-5) 0 0;
    padding: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
    text-align: center;
  }
  .proposal p { margin: 0 0 var(--space-3); }
  .proposal .row { display: flex; gap: var(--space-3); justify-content: center; }
  .proposal button.primary { width: auto; margin: 0; }
  .medal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-3); }
  .medal {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4);
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
  }
  .medal svg { flex: none; color: var(--color-accent); }
  .medal.locked svg { color: var(--color-text-muted); }
  .medal .name { display: block; font-weight: 600; }
  .medal.locked .name { color: var(--color-text-secondary); }
  .medal .desc { display: block; color: var(--color-text-muted); font-size: 0.875rem; }
  .medal .state { margin-left: auto; color: var(--color-text-muted); font-size: 0.875rem; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
      Mathe-Trainer
    </h1>
    <p class="instruction" id="instruction">Wähle Rechenart und Zahlenbereich.</p>
  </header>

  <section id="setup" aria-label="Einstellungen">
    <h2>Rechenart</h2>
    <div class="chips" id="op-chips">
      <button type="button" data-op="+" aria-pressed="true">Plus</button>
      <button type="button" data-op="-" aria-pressed="false">Minus</button>
    </div>
    <h2>Zahlenbereich</h2>
    <div class="chips" id="range-chips">
      <button type="button" data-min="0" data-max="10" aria-pressed="true">0 bis 10</button>
      <button type="button" data-min="0" data-max="20" aria-pressed="false">0 bis 20</button>
      <button type="button" data-min="0" data-max="50" aria-pressed="false">0 bis 50</button>
      <button type="button" data-min="0" data-max="100" aria-pressed="false">0 bis 100</button>
      <button type="button" data-min="10" data-max="20" aria-pressed="false">10 bis 20</button>
      <button type="button" data-min="50" data-max="100" aria-pressed="false">50 bis 100</button>
      <button type="button" id="custom-chip" aria-pressed="false">Eigener Bereich</button>
    </div>
    <p class="range-note">Auch das Ergebnis bleibt in diesem Bereich.</p>
    <div class="custom-range" id="custom-range" hidden>
      <div>
        <label for="custom-min">Von</label>
        <input id="custom-min" type="number" inputmode="numeric" min="0" max="1000" value="0">
      </div>
      <div>
        <label for="custom-max">Bis</label>
        <input id="custom-max" type="number" inputmode="numeric" min="0" max="1000" value="10">
      </div>
    </div>
    <p class="form-error" id="form-error" role="status"></p>
    <div class="progressbox" id="progressbox">
      <p class="level-line"><strong id="level-name"></strong> <span class="xp" id="xp-line"></span></p>
      <div class="bar" role="progressbar" id="level-bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Fortschritt zum nächsten Level"><div class="fill" id="level-fill"></div></div>
      <p class="next-level" id="next-level"></p>
      <button type="button" id="show-medals">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
        <span id="medal-count">Medaillen</span>
      </button>
    </div>
    <button type="button" class="primary" id="start">Los geht's</button>
    <footer class="app-footer">
      <p class="storage-note">Fortschritt und Einstellungen bleiben auf diesem Gerät.</p>
      <button type="button" class="btn-link" id="reset-all">Alles zurücksetzen</button>
      <p class="reset-status" id="reset-status" role="status"></p>
    </footer>
  </section>

  <section id="medal-screen" aria-label="Medaillen" hidden>
    <h2>Medaillen</h2>
    <ul class="medal-list" id="medal-list"></ul>
    <button type="button" class="primary" id="medals-back">Zurück</button>
  </section>

  <section id="quiz" aria-label="Aufgabe" hidden>
    <div class="toolbar">
      <p class="stats" id="stats">Richtig: 0 · Serie: 0</p>
      <button type="button" id="change-settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        Ändern
      </button>
    </div>
    <p class="problem" id="problem"></p>
    <div class="slots" id="slots" aria-label="Deine Antwort" role="group"></div>
    <p class="advisory">Bei der letzten Ziffer siehst du sofort, ob es stimmt.</p>
    <div class="hint-row">
      <button type="button" id="hint-toggle" aria-expanded="false" aria-controls="hint">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        <span id="hint-toggle-label">Rechenweg zeigen</span>
      </button>
    </div>
    <div class="hint" id="hint" role="status"></div>
    <div class="keypad" id="keypad" aria-label="Ziffernblock" role="group">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <span aria-hidden="true"></span>
      <button type="button" data-digit="0">0</button>
      <button type="button" id="backspace" aria-label="Ziffer löschen">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>
      </button>
    </div>
    <p class="feedback" id="feedback" role="status"></p>
    <div class="reward" id="reward" hidden></div>
    <div class="proposal" id="proposal" hidden>
      <p id="proposal-text"></p>
      <div class="row">
        <button type="button" class="primary" id="propose-yes"></button>
        <button type="button" id="propose-later">Später</button>
      </div>
    </div>
    <button type="button" class="primary" id="next" hidden>Weiter</button>
  </section>
</main>

<script>
(function () {
  "use strict";
  var SETTINGS_KEY = "add-subtract.settings";
  var STATS_KEY = "add-subtract.stats";
  var PRESETS = ["0-10", "0-20", "0-50", "0-100", "10-20", "50-100"];
  var LADDER = { "0-10": 20, "0-20": 50, "0-50": 100 };
  var PROPOSE_AFTER = 10;

  var LEVELS = [
    { xp: 0, name: "Zahlenstart" },
    { xp: 20, name: "Zahlenspringer" },
    { xp: 60, name: "Rechenfuchs" },
    { xp: 150, name: "Rechenprofi" },
    { xp: 300, name: "Zahlenmeister" },
    { xp: 600, name: "Rechenheld" }
  ];

  var ICONS = {
    flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
    checkcheck: '<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
    award: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>',
    hash: '<line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>',
    rotate: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
    minus: '<path d="M5 12h14"/>',
    mountain: '<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>',
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>'
  };

  var MEDALS = [
    { id: "start", name: "Startklar", desc: "Erste Aufgabe gelöst", icon: "flag", done: function (s) { return s.solved >= 1; } },
    { id: "dran", name: "Dranbleiber", desc: "8 Aufgaben gelöst", icon: "checkcheck", done: function (s) { return s.solved >= 8; } },
    { id: "kuenstler", name: "Rechenkünstler", desc: "34 Aufgaben gelöst", icon: "award", done: function (s) { return s.solved >= 34; } },
    { id: "finger", name: "Fleissige Finger", desc: "144 Ziffern getippt", icon: "hash", done: function (s) { return s.digitsTyped >= 144; } },
    { id: "zweiter", name: "Nicht aufgegeben", desc: "21 Aufgaben im zweiten Anlauf gelöst", icon: "rotate", done: function (s) { return s.retriedSolved >= 21; } },
    { id: "minus", name: "Minus-Fuchs", desc: "21 Minus-Aufgaben gelöst", icon: "minus", done: function (s) { return s.minusSolved >= 21; } },
    { id: "gross", name: "Grosse Zahlen", desc: "8 Aufgaben im Bereich bis 100 gelöst", icon: "mountain", done: function (s) { return s.max100Solved >= 8; } },
    { id: "entdecker", name: "Entdecker", desc: "In jedem Bereich eine Aufgabe gelöst", icon: "compass", done: function (s) {
      return PRESETS.every(function (k) { return (s.rangesSolved[k] || 0) >= 1; });
    } }
  ];

  var setupEl = document.getElementById("setup");
  var quizEl = document.getElementById("quiz");
  var medalScreen = document.getElementById("medal-screen");
  var instructionEl = document.getElementById("instruction");
  var opChips = document.getElementById("op-chips");
  var rangeChips = document.getElementById("range-chips");
  var customChip = document.getElementById("custom-chip");
  var customRange = document.getElementById("custom-range");
  var customMin = document.getElementById("custom-min");
  var customMax = document.getElementById("custom-max");
  var formError = document.getElementById("form-error");
  var startBtn = document.getElementById("start");
  var statsEl = document.getElementById("stats");
  var problemEl = document.getElementById("problem");
  var slotsEl = document.getElementById("slots");
  var keypadEl = document.getElementById("keypad");
  var feedbackEl = document.getElementById("feedback");
  var rewardEl = document.getElementById("reward");
  var proposalEl = document.getElementById("proposal");
  var proposalText = document.getElementById("proposal-text");
  var proposeYes = document.getElementById("propose-yes");
  var proposeLater = document.getElementById("propose-later");
  var nextBtn = document.getElementById("next");
  var hintEl = document.getElementById("hint");
  var hintToggle = document.getElementById("hint-toggle");
  var hintLabel = document.getElementById("hint-toggle-label");
  var resetStatus = document.getElementById("reset-status");

  function emptyStats() {
    return {
      xp: 0, solved: 0, streak: 0, firstTryStreak: 0,
      digitsTyped: 0, retriedSolved: 0, minusSolved: 0, max100Solved: 0,
      rangesSolved: {}
    };
  }

  var settings = { op: "+", min: 0, max: 10, custom: false };
  var stats = emptyStats();
  var a = 0, b = 0, correct = 0, answerStr = "";
  var entry = "";
  var attempts = 0;
  var locked = false;
  var hintUsed = false;
  var proposedMax = 0;

  try {
    var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s && (s.op === "+" || s.op === "-") && s.min >= 0 && s.max >= s.min) settings = s;
    var t = JSON.parse(localStorage.getItem(STATS_KEY));
    if (t && typeof t === "object") {
      Object.keys(stats).forEach(function (k) {
        if (typeof t[k] === typeof stats[k]) stats[k] = t[k];
      });
      if (!stats.rangesSolved || typeof stats.rangesSolved !== "object") stats.rangesSolved = {};
    }
  } catch (e) { /* defaults stay */ }

  function save() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    } catch (e) { /* storage unavailable */ }
  }

  function rangeKey() { return settings.custom ? "custom" : settings.min + "-" + settings.max; }

  function levelIndex(xp) {
    var i = 0;
    for (var l = 0; l < LEVELS.length; l++) if (xp >= LEVELS[l].xp) i = l;
    return i;
  }

  function unlockedIds() {
    return MEDALS.filter(function (m) { return m.done(stats); }).map(function (m) { return m.id; });
  }

  function xpForSolve() {
    var mult = settings.max <= 10 ? 1 : settings.max <= 20 ? 2 : settings.max <= 50 ? 3 : 4;
    return 2 * mult;
  }

  function svgIcon(key, size) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[key] + "</svg>";
  }

  function renderProgress() {
    var li = levelIndex(stats.xp);
    var cur = LEVELS[li];
    var next = LEVELS[li + 1];
    document.getElementById("level-name").textContent = cur.name;
    document.getElementById("xp-line").textContent = "· " + stats.xp + " XP";
    var bar = document.getElementById("level-bar");
    var fill = document.getElementById("level-fill");
    if (next) {
      var pct = Math.round(((stats.xp - cur.xp) / (next.xp - cur.xp)) * 100);
      fill.style.width = pct + "%";
      bar.setAttribute("aria-valuenow", String(pct));
      document.getElementById("next-level").textContent = "Noch " + (next.xp - stats.xp) + " XP bis " + next.name + ".";
    } else {
      fill.style.width = "100%";
      bar.setAttribute("aria-valuenow", "100");
      document.getElementById("next-level").textContent = "Höchstes Level erreicht. Die XP zählen weiter.";
    }
    document.getElementById("medal-count").textContent = "Medaillen · " + unlockedIds().length + " von " + MEDALS.length;
  }

  function renderMedals() {
    var list = document.getElementById("medal-list");
    list.innerHTML = "";
    MEDALS.forEach(function (m) {
      var open = m.done(stats);
      var li = document.createElement("li");
      li.className = "medal" + (open ? "" : " locked");
      li.innerHTML = svgIcon(m.icon, 24) +
        '<span><span class="name">' + m.name + '</span><span class="desc">' + m.desc + "</span></span>" +
        '<span class="state">' + (open ? "Geschafft" : "Noch offen") + "</span>";
      list.appendChild(li);
    });
  }

  function renderStats() {
    statsEl.textContent = "Richtig: " + stats.solved + " · Serie: " + stats.streak;
  }

  function renderSlots() {
    var slots = slotsEl.children;
    for (var i = 0; i < slots.length; i++) slots[i].textContent = entry[i] || "";
  }

  function clearMarks() {
    Array.prototype.forEach.call(slotsEl.children, function (s) { s.classList.remove("wrong", "ok"); });
  }

  function newProblem() {
    var span = settings.max - settings.min;
    correct = settings.min + Math.floor(Math.random() * (span + 1));
    if (settings.op === "+") {
      a = Math.floor(Math.random() * (correct + 1));
      b = correct - a;
    } else {
      b = Math.floor(Math.random() * (settings.max - correct + 1));
      a = correct + b;
    }
    answerStr = String(correct);
    entry = "";
    attempts = 0;
    locked = false;
    hintUsed = false;
    closeHint();
    problemEl.textContent = a + " " + (settings.op === "+" ? "+" : "−") + " " + b + " =";
    slotsEl.innerHTML = "";
    for (var i = 0; i < answerStr.length; i++) {
      var slot = document.createElement("span");
      slot.className = "slot";
      slotsEl.appendChild(slot);
    }
    feedbackEl.textContent = "";
    rewardEl.hidden = true;
    rewardEl.innerHTML = "";
    proposalEl.hidden = true;
    nextBtn.hidden = true;
  }

  // ── Rechenwege ────────────────────────────────────────────────────
  // A hint breaks the task into easier steps and leaves the last step
  // open, so the learner still does the closing move. It never writes
  // out the solved task.
  function tensOf(n) { return n - (n % 10); }

  // Stepping stones when counting up from one number to another:
  // the next ten, then the next hundred, then the goal.
  function stones(from, to) {
    var list = [];
    var cur = from;
    if (cur % 10 !== 0 && tensOf(cur) + 10 <= to) { cur = tensOf(cur) + 10; list.push(cur); }
    if (cur % 100 !== 0 && cur - (cur % 100) + 100 <= to) { cur = cur - (cur % 100) + 100; list.push(cur); }
    if (cur < to) list.push(to);
    return list;
  }

  // How far a number sits below the next whole ten. 1 or 2 means it is
  // close enough to round up and give the difference back afterwards.
  function toNextTen(n) { return (10 - (n % 10)) % 10; }

  // Counting up from the smaller number to the larger one.
  function countUp(from, to) {
    var marks = stones(from, to);
    if (marks.length < 2) {
      return {
        rule: "close",
        title: "Zähle von " + from + " hinauf bis " + to + ".",
        steps: [from + " + ? = " + to]
      };
    }
    var lines = [], parts = [], cur = from;
    marks.forEach(function (m) {
      lines.push(cur + " + " + (m - cur) + " = " + m);
      parts.push(m - cur);
      cur = m;
    });
    lines.push("Zusammen: " + parts.join(" + ") + " = ?");
    return { rule: "close", title: "Zähle von " + from + " hinauf bis " + to + ".", steps: lines };
  }

  function plusHint(x, y) {
    var big = Math.max(x, y), small = Math.min(x, y);
    var ones = big % 10;
    if (small === 0) {
      return { rule: "trivial", title: "Wenn du nichts dazuzählst, bleibt die Zahl gleich.", steps: [] };
    }
    // Close to a whole ten: round up, then take the extra back off.
    var up = toNextTen(small);
    if (up > 0 && up <= 2 && big >= 10) {
      return {
        rule: "round",
        title: "Runde die " + small + " auf " + (small + up) + ".",
        steps: [
          big + " + " + (small + up) + " = " + (big + small + up),
          (big + small + up) + " − " + up + " = ?"
        ],
        note: "Du hast " + up + " zu viel dazugezählt, darum kommt " + up + " wieder weg."
      };
    }
    if (small < 10) {
      var toTen = 10 - ones;
      if (ones + small === 10) {
        return {
          rule: "fill",
          title: "Das ergibt genau eine Zehn.",
          steps: [],
          note: big + " und " + small + " füllen die nächste Zehn ganz auf."
        };
      }
      // The ones cross a ten: fill up to it first.
      if (ones + small > 10) {
        return {
          rule: "fill",
          title: "Fülle zuerst auf die nächste Zehn.",
          steps: [
            big + " + " + toTen + " = " + (big + toTen),
            (big + toTen) + " + " + (small - toTen) + " = ?"
          ],
          note: "Zerlege die " + small + " in " + toTen + " und " + (small - toTen) + "."
        };
      }
      if (big < 10) {
        return {
          rule: "simple",
          title: "Zähle von der grösseren Zahl weiter.",
          steps: [],
          note: "Beginne bei " + big + " und zähle " + small + " weiter."
        };
      }
      if (ones === 0) {
        return {
          rule: "steps",
          title: "Die Einer kommen einfach dazu.",
          steps: [],
          note: "Die " + big + " bleibt gleich, die " + small + " stellst du dahinter."
        };
      }
      return {
        rule: "steps",
        title: "Rechne nur die Einer.",
        steps: [ones + " + " + small + " = ?"],
        note: "Die " + tensOf(big) + " davor bleibt gleich."
      };
    }
    if (small % 10 === 0) {
      if (ones === 0) {
        return {
          rule: "steps",
          title: "Rechne nur die Zehner.",
          steps: [(big / 10) + " + " + (small / 10) + " = ?"],
          note: "An das Ergebnis kommt noch eine Null."
        };
      }
      return {
        rule: "steps",
        title: "Zerlege die " + big + " in " + tensOf(big) + " und " + ones + ".",
        steps: [
          tensOf(big) + " + " + small + " = " + (tensOf(big) + small),
          (tensOf(big) + small) + " + " + ones + " = ?"
        ]
      };
    }
    // Tens first, then the ones.
    return {
      rule: "steps",
      title: "Zerlege die " + small + " in " + tensOf(small) + " und " + (small % 10) + ".",
      steps: [
        big + " + " + tensOf(small) + " = " + (big + tensOf(small)),
        (big + tensOf(small)) + " + " + (small % 10) + " = ?"
      ]
    };
  }

  // Four questions in order, the way a child would pick a way through:
  // 1. Is the number to take away close to the first one? Count up.
  // 2. Is it close to a whole ten? Round it and give the rest back.
  // 3. Do the ones cross a ten? Go over the ten in steps.
  // 4. Otherwise take the tens away first, then the ones.
  function minusHint(x, y) {
    var aOnes = x % 10, bOnes = y % 10;
    var bTens = tensOf(y);
    if (y === 0) {
      return { rule: "trivial", title: "Wenn du nichts abziehst, bleibt die Zahl gleich.", steps: [] };
    }
    if (x === y) {
      return { rule: "trivial", title: "Du ziehst die ganze Zahl ab.", steps: [], note: "Es bleibt nichts übrig." };
    }
    if (x < 10) {
      return {
        rule: "simple",
        title: "Zähle in kleinen Schritten zurück.",
        steps: [],
        note: "Beginne bei " + x + " und zähle " + y + " zurück."
      };
    }
    // Standing exactly on the ten: this is the number pair to 10.
    if (x === 10) return countUp(y, 10);
    // 1. Close to the first number: counting up is shorter than taking away.
    if (y >= 10 && x - y <= 10) return countUp(y, x);
    // 2. Close to a whole ten: round up, then give the difference back.
    var up = toNextTen(y);
    if (up > 0 && up <= 2) {
      return {
        rule: "round",
        title: "Runde die " + y + " auf " + (y + up) + ".",
        steps: [
          x + " − " + (y + up) + " = " + (x - y - up),
          (x - y - up) + " + " + up + " = ?"
        ],
        note: "Du hast " + up + " zu viel abgezogen, darum kommt " + up + " wieder dazu."
      };
    }
    // 3. The ones cross a ten: take the tens away, then step over the ten.
    if (aOnes < bOnes) {
      var lines = [];
      var cur = x;
      if (bTens > 0) {
        cur = x - bTens;
        lines.push(x + " − " + bTens + " = " + cur);
      }
      if (aOnes === 0) {
        // Standing on a whole ten: take the rest out of the last ten.
        lines.push("10 − " + bOnes + " = " + (10 - bOnes));
        lines.push((cur - 10) + " + " + (10 - bOnes) + " = ?");
        return {
          rule: "bridge",
          title: bTens > 0 ? "Ziehe zuerst die Zehner ab." : "Nimm es von der letzten Zehn weg.",
          steps: lines,
          note: "Zerlege die " + cur + " in " + (cur - 10) + " und 10."
        };
      }
      lines.push(cur + " − " + aOnes + " = " + tensOf(cur));
      lines.push(tensOf(cur) + " − " + (bOnes - aOnes) + " = ?");
      return {
        rule: "bridge",
        title: "Gehe zuerst auf die Zehn.",
        steps: lines,
        note: bTens > 0
          ? "Zerlege die " + y + " in " + bTens + ", " + aOnes + " und " + (bOnes - aOnes) + "."
          : "Zerlege die " + y + " in " + aOnes + " und " + (bOnes - aOnes) + "."
      };
    }
    // 4. Nothing crosses: tens first, then the ones.
    if (y < 10) {
      return {
        rule: "steps",
        title: "Rechne nur die Einer.",
        steps: [aOnes + " − " + y + " = ?"],
        note: "Die " + tensOf(x) + " davor bleibt gleich."
      };
    }
    if (bOnes === 0) {
      if (aOnes === 0) {
        return {
          rule: "steps",
          title: "Rechne nur die Zehner.",
          steps: [(x / 10) + " − " + (y / 10) + " = ?"],
          note: "An das Ergebnis kommt noch eine Null."
        };
      }
      return {
        rule: "steps",
        title: "Zerlege die " + x + " in " + tensOf(x) + " und " + aOnes + ".",
        steps: [tensOf(x) + " − " + y + " = " + (tensOf(x) - y), (tensOf(x) - y) + " + " + aOnes + " = ?"]
      };
    }
    return {
      rule: "steps",
      title: "Ziehe zuerst die Zehner ab.",
      steps: [
        x + " − " + bTens + " = " + (x - bTens),
        (x - bTens) + " − " + bOnes + " = ?"
      ],
      note: "Zerlege die " + y + " in " + bTens + " und " + bOnes + "."
    };
  }

  function renderHint() {
    var h = settings.op === "+" ? plusHint(a, b) : minusHint(a, b);
    var html = '<p class="hint-title">' + h.title + "</p>";
    if (h.steps.length) {
      html += '<ol class="hint-steps">' + h.steps.map(function (s) {
        return "<li>" + s + "</li>";
      }).join("") + "</ol>";
    }
    if (h.note) html += '<p class="hint-note">' + h.note + "</p>";
    hintEl.innerHTML = html;
  }

  function openHint() {
    hintUsed = true;
    renderHint();
    hintToggle.setAttribute("aria-expanded", "true");
    hintLabel.textContent = "Rechenweg ausblenden";
  }

  function closeHint() {
    hintEl.innerHTML = "";
    hintToggle.setAttribute("aria-expanded", "false");
    hintLabel.textContent = "Rechenweg zeigen";
  }

  function showReward(xpGain, medalsBefore, levelBefore) {
    var lines = ["+" + xpGain + " XP"];
    var li = levelIndex(stats.xp);
    if (li > levelBefore) lines.push("Neues Level: " + LEVELS[li].name);
    unlockedIds().forEach(function (id) {
      if (medalsBefore.indexOf(id) === -1) {
        var m = MEDALS.filter(function (x) { return x.id === id; })[0];
        lines.push("Medaille: " + m.name);
      }
    });
    rewardEl.innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join("");
    rewardEl.hidden = false;
  }

  function maybePropose() {
    var target = LADDER[rangeKey()];
    if (!target || stats.firstTryStreak < PROPOSE_AFTER) return false;
    proposedMax = target;
    proposalText.textContent = "Das klappt richtig gut. Möchtest du bis " + target + " rechnen?";
    proposeYes.textContent = "Ja, bis " + target;
    proposalEl.hidden = false;
    proposeYes.focus();
    return true;
  }

  function finishTask(xpGain, solvedByLearner) {
    var medalsBefore = unlockedIds();
    var levelBefore = levelIndex(stats.xp);
    if (solvedByLearner) {
      stats.solved++;
      stats.streak++;
      // A hint costs nothing, but a task solved with help does not count
      // toward the mastery streak that proposes a harder range.
      if (attempts === 0 && !hintUsed) stats.firstTryStreak++;
      else if (attempts > 0) { stats.retriedSolved++; stats.firstTryStreak = 0; }
      if (settings.op === "-") stats.minusSolved++;
      if (settings.max >= 100) stats.max100Solved++;
      var key = rangeKey();
      if (key !== "custom") stats.rangesSolved[key] = (stats.rangesSolved[key] || 0) + 1;
    } else {
      stats.streak = 0;
      stats.firstTryStreak = 0;
    }
    stats.xp += xpGain;
    save();
    renderStats();
    showReward(xpGain, medalsBefore, levelBefore);
    if (!solvedByLearner || !maybePropose()) {
      nextBtn.hidden = false;
      nextBtn.focus();
    }
  }

  function evaluate() {
    if (entry === answerStr) {
      locked = true;
      Array.prototype.forEach.call(slotsEl.children, function (s) { s.classList.add("ok"); });
      feedbackEl.textContent = "Richtig. " + a + " " + (settings.op === "+" ? "+" : "−") + " " + b + " = " + correct + ".";
      finishTask(xpForSolve(), true);
      return;
    }
    attempts++;
    for (var i = 0; i < answerStr.length; i++) {
      if (entry[i] !== answerStr[i]) slotsEl.children[i].classList.add("wrong");
    }
    if (attempts === 1) {
      feedbackEl.textContent = "Fast. Versuch es noch einmal.";
    } else if (attempts === 2) {
      openHint();
      feedbackEl.textContent = "Fast. Der Rechenweg unter der Aufgabe hilft dir weiter.";
    } else {
      locked = true;
      entry = answerStr;
      renderSlots();
      clearMarks();
      feedbackEl.textContent = "Die Lösung ist " + correct + ". Schau sie dir an und mach dann weiter.";
      finishTask(1, false);
    }
  }

  function pressDigit(d) {
    if (locked || quizEl.hidden) return;
    if (entry.length >= answerStr.length) return;
    clearMarks();
    entry += d;
    stats.digitsTyped++;
    renderSlots();
    if (entry.length === answerStr.length) evaluate();
  }

  function backspace() {
    if (locked || quizEl.hidden) return;
    clearMarks();
    entry = entry.slice(0, -1);
    renderSlots();
  }

  function showSetup() {
    quizEl.hidden = true;
    medalScreen.hidden = true;
    setupEl.hidden = false;
    instructionEl.textContent = "Wähle Rechenart und Zahlenbereich.";
    reflectSettings();
    renderProgress();
  }

  function showQuiz() {
    setupEl.hidden = true;
    medalScreen.hidden = true;
    resetStatus.textContent = "";
    quizEl.hidden = false;
    instructionEl.textContent = "Rechne die Aufgabe und tippe die Antwort ein.";
    stats.firstTryStreak = 0;
    renderStats();
    newProblem();
  }

  function reflectSettings() {
    opChips.querySelectorAll("button").forEach(function (btn) {
      btn.setAttribute("aria-pressed", String(btn.dataset.op === settings.op));
    });
    var matched = false;
    rangeChips.querySelectorAll("button[data-min]").forEach(function (btn) {
      var on = !settings.custom && Number(btn.dataset.min) === settings.min && Number(btn.dataset.max) === settings.max;
      btn.setAttribute("aria-pressed", String(on));
      if (on) matched = true;
    });
    customChip.setAttribute("aria-pressed", String(settings.custom || !matched));
    customRange.hidden = !(settings.custom || !matched);
    if (settings.custom) { customMin.value = settings.min; customMax.value = settings.max; }
  }

  opChips.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-op]");
    if (!btn) return;
    settings.op = btn.dataset.op;
    reflectSettings();
  });

  rangeChips.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (btn === customChip) {
      settings.custom = true;
    } else {
      settings.custom = false;
      settings.min = Number(btn.dataset.min);
      settings.max = Number(btn.dataset.max);
    }
    formError.textContent = "";
    reflectSettings();
  });

  startBtn.addEventListener("click", function () {
    if (settings.custom || customChip.getAttribute("aria-pressed") === "true") {
      var min = parseInt(customMin.value, 10);
      var max = parseInt(customMax.value, 10);
      if (isNaN(min) || isNaN(max) || min < 0 || max > 1000 || min > max) {
        formError.textContent = "Bitte einen gültigen Bereich wählen. Von darf nicht grösser als Bis sein.";
        return;
      }
      settings.custom = true;
      settings.min = min;
      settings.max = max;
    }
    formError.textContent = "";
    save();
    showQuiz();
  });

  hintToggle.addEventListener("click", function () {
    if (hintToggle.getAttribute("aria-expanded") === "true") closeHint();
    else openHint();
  });

  document.getElementById("reset-all").addEventListener("click", function () {
    var ok = confirm("Allen Fortschritt löschen? XP, Medaillen und gelöste Aufgaben verschwinden. Die Daten liegen nur auf diesem Gerät.");
    if (!ok) return;
    stats = emptyStats();
    save();
    renderStats();
    renderProgress();
    resetStatus.textContent = "Der Fortschritt wurde gelöscht. Die Einstellungen bleiben.";
  });

  document.getElementById("change-settings").addEventListener("click", showSetup);
  document.getElementById("show-medals").addEventListener("click", function () {
    resetStatus.textContent = "";
    setupEl.hidden = true;
    medalScreen.hidden = false;
    instructionEl.textContent = "Deine Medaillen. Offene Ziele bleiben sichtbar.";
    renderMedals();
  });
  document.getElementById("medals-back").addEventListener("click", showSetup);

  keypadEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (btn.id === "backspace") backspace();
    else if (btn.dataset.digit) pressDigit(btn.dataset.digit);
  });

  nextBtn.addEventListener("click", newProblem);

  proposeYes.addEventListener("click", function () {
    settings.custom = false;
    settings.min = 0;
    settings.max = proposedMax;
    stats.firstTryStreak = 0;
    save();
    newProblem();
  });

  proposeLater.addEventListener("click", function () {
    stats.firstTryStreak = 0;
    save();
    newProblem();
  });

  document.addEventListener("keydown", function (e) {
    if (quizEl.hidden) return;
    if (e.key >= "0" && e.key <= "9") { pressDigit(e.key); }
    else if (e.key === "Backspace") { backspace(); e.preventDefault(); }
    else if (e.key === "Enter") {
      // A focused button already handles Enter itself. Without this the
      // quiz would act twice, for example open the Rechenweg and jump to
      // the next task in the same keypress.
      if (e.target && e.target.closest && e.target.closest("button")) return;
      if (!proposalEl.hidden) proposeLater.click();
      else if (!nextBtn.hidden) newProblem();
    }
  });

  reflectSettings();
  renderStats();
  renderProgress();
})();
</script>
</body>
</html>
