<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Trainer</title>
<meta name="description" content="Plus und Minus üben. Ruhig, ohne Zeitdruck.">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<style>
  :root {
    --color-background-app: #0E141D;
    --color-background-surface: #162232;
    --color-background-surface-raised: #1B2A3C;
    --color-background-surface-soft: #13202E;
    --color-action-primary-bg: #F5F7FA;
    --color-action-primary-text: #101722;
    --color-action-primary-hover-bg: #E5EAF0;
    --color-action-secondary-bg: #1C2A3B;
    --color-action-secondary-hover-bg: #26384E;
    --color-border-subtle: #263648;
    --color-border-focus: #F4E7B1;
    --color-text-primary: #F5F7FA;
    --color-text-secondary: #C5D0DD;
    --color-text-muted: #8FA1B4;
    --color-accent: #9BC8A8;
    --color-accent-soft: #9BC8A826;
    --color-success-soft: #8ECFA326;
    --color-danger-soft: #E58C8A26;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --radius-md: 0.75rem;
    --radius-pill: 999px;
    --duration-base: 180ms;
    --easing-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--color-background-app);
    color: var(--color-text-primary);
    font-family: system-ui, sans-serif;
    line-height: 1.55;
    padding: var(--space-4);
  }
  main { max-width: 26rem; margin: 0 auto; }
  header { text-align: center; margin-block: var(--space-6); }
  h1 {
    font-size: 1.75rem;
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin: 0 0 var(--space-2);
  }
  h1 svg { color: var(--color-accent); vertical-align: -0.15em; }
  .instruction { margin: 0; color: var(--color-text-secondary); }
  h2 { font-size: 1.125rem; margin: var(--space-6) 0 var(--space-3); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  button {
    font: inherit;
    color: var(--color-text-primary);
    background: var(--color-action-secondary-bg);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-pill);
    min-height: 3rem;
    padding: 0 var(--space-5);
    cursor: pointer;
    transition: background-color var(--duration-base) var(--easing-out);
  }
  button:hover { background: var(--color-action-secondary-hover-bg); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--color-border-focus);
    outline-offset: 2px;
  }
  button[aria-pressed="true"] {
    border-color: var(--color-accent);
    background: var(--color-accent-soft);
  }
  button.primary {
    background: var(--color-action-primary-bg);
    color: var(--color-action-primary-text);
    font-weight: 600;
    border: none;
    width: 100%;
    margin-top: var(--space-6);
  }
  button.primary:hover { background: var(--color-action-primary-hover-bg); }
  .custom-range { margin-top: var(--space-3); display: flex; gap: var(--space-3); align-items: end; }
  .custom-range label { display: block; font-size: 0.875rem; color: var(--color-text-secondary); }
  .custom-range input {
    width: 6rem;
    font: inherit;
    color: var(--color-text-primary);
    background: var(--color-background-surface-soft);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    height: 3rem;
    padding: 0 var(--space-3);
  }
  .form-error { color: var(--color-text-secondary); margin: var(--space-3) 0 0; min-height: 1.5em; }
  .range-note { color: var(--color-text-muted); font-size: 0.875rem; margin: var(--space-3) 0 0; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
  }
  .stats {
    color: var(--color-text-secondary);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }
  .toolbar button { min-height: 2.75rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: var(--space-2); }
  .problem {
    text-align: center;
    font-size: 2.125rem;
    line-height: 1.2;
    letter-spacing: -0.015em;
    margin: 0 0 var(--space-5);
    font-variant-numeric: tabular-nums;
  }
  .slots {
    display: flex;
    justify-content: center;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
  }
  .slot {
    width: 3rem;
    height: 3.5rem;
    display: grid;
    place-items: center;
    font-size: 1.75rem;
    font-variant-numeric: tabular-nums;
    background: var(--color-background-surface-soft);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
  }
  .slot.ok { background: var(--color-success-soft); border-color: var(--color-accent); }
  .slot.wrong { background: var(--color-danger-soft); }
  .advisory {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.875rem;
    margin: 0 0 var(--space-5);
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
    max-width: 18rem;
    margin: 0 auto;
  }
  .keypad button {
    min-height: 3rem;
    font-size: 1.375rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    background: var(--color-background-surface-raised);
  }
  .keypad button:hover { background: var(--color-action-secondary-hover-bg); }
  .keypad button:disabled { opacity: 0.5; cursor: default; }
  .feedback {
    margin: var(--space-5) 0 0;
    padding: var(--space-4);
    border-radius: var(--radius-md);
    background: var(--color-background-surface);
    border: 1px solid var(--color-border-subtle);
    text-align: center;
    min-height: 3.5rem;
  }
  .feedback:empty { visibility: hidden; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
      Mathe-Trainer
    </h1>
    <p class="instruction" id="instruction">Wähle Rechenart und Zahlenbereich.</p>
  </header>

  <section id="setup" aria-label="Einstellungen">
    <h2>Rechenart</h2>
    <div class="chips" id="op-chips">
      <button type="button" data-op="+" aria-pressed="true">Plus</button>
      <button type="button" data-op="-" aria-pressed="false">Minus</button>
    </div>
    <h2>Zahlenbereich</h2>
    <div class="chips" id="range-chips">
      <button type="button" data-min="0" data-max="10" aria-pressed="true">0 bis 10</button>
      <button type="button" data-min="0" data-max="20" aria-pressed="false">0 bis 20</button>
      <button type="button" data-min="0" data-max="50" aria-pressed="false">0 bis 50</button>
      <button type="button" data-min="0" data-max="100" aria-pressed="false">0 bis 100</button>
      <button type="button" data-min="10" data-max="20" aria-pressed="false">10 bis 20</button>
      <button type="button" data-min="50" data-max="100" aria-pressed="false">50 bis 100</button>
      <button type="button" id="custom-chip" aria-pressed="false">Eigener Bereich</button>
    </div>
    <p class="range-note">Auch das Ergebnis bleibt in diesem Bereich.</p>
    <div class="custom-range" id="custom-range" hidden>
      <div>
        <label for="custom-min">Von</label>
        <input id="custom-min" type="number" inputmode="numeric" min="0" max="1000" value="0">
      </div>
      <div>
        <label for="custom-max">Bis</label>
        <input id="custom-max" type="number" inputmode="numeric" min="0" max="1000" value="10">
      </div>
    </div>
    <p class="form-error" id="form-error" role="status"></p>
    <button type="button" class="primary" id="start">Los geht's</button>
  </section>

  <section id="quiz" aria-label="Aufgabe" hidden>
    <div class="toolbar">
      <p class="stats" id="stats">Richtig: 0 · Serie: 0</p>
      <button type="button" id="change-settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        Ändern
      </button>
    </div>
    <p class="problem" id="problem"></p>
    <div class="slots" id="slots" aria-label="Deine Antwort" role="group"></div>
    <p class="advisory">Bei der letzten Ziffer siehst du sofort, ob es stimmt.</p>
    <div class="keypad" id="keypad" aria-label="Ziffernblock" role="group">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <span aria-hidden="true"></span>
      <button type="button" data-digit="0">0</button>
      <button type="button" id="backspace" aria-label="Ziffer löschen">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>
      </button>
    </div>
    <p class="feedback" id="feedback" role="status"></p>
    <button type="button" class="primary" id="next" hidden>Weiter</button>
  </section>
</main>

<script>
(function () {
  "use strict";
  var SETTINGS_KEY = "add-subtract.settings";
  var STATS_KEY = "add-subtract.stats";

  var setupEl = document.getElementById("setup");
  var quizEl = document.getElementById("quiz");
  var instructionEl = document.getElementById("instruction");
  var opChips = document.getElementById("op-chips");
  var rangeChips = document.getElementById("range-chips");
  var customChip = document.getElementById("custom-chip");
  var customRange = document.getElementById("custom-range");
  var customMin = document.getElementById("custom-min");
  var customMax = document.getElementById("custom-max");
  var formError = document.getElementById("form-error");
  var startBtn = document.getElementById("start");
  var statsEl = document.getElementById("stats");
  var problemEl = document.getElementById("problem");
  var slotsEl = document.getElementById("slots");
  var keypadEl = document.getElementById("keypad");
  var feedbackEl = document.getElementById("feedback");
  var nextBtn = document.getElementById("next");

  var settings = { op: "+", min: 0, max: 10, custom: false };
  var stats = { solved: 0, streak: 0 };
  var a = 0, b = 0, correct = 0, answerStr = "";
  var entry = "";
  var attempts = 0;
  var locked = false;

  try {
    var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s && (s.op === "+" || s.op === "-") && s.min >= 0 && s.max >= s.min) settings = s;
    var t = JSON.parse(localStorage.getItem(STATS_KEY));
    if (t && t.solved >= 0) stats = { solved: t.solved, streak: t.streak || 0 };
  } catch (e) { /* defaults stay */ }

  function save() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    } catch (e) { /* storage unavailable */ }
  }

  function reflectSettings() {
    opChips.querySelectorAll("button").forEach(function (btn) {
      btn.setAttribute("aria-pressed", String(btn.dataset.op === settings.op));
    });
    var matched = false;
    rangeChips.querySelectorAll("button[data-min]").forEach(function (btn) {
      var on = !settings.custom && Number(btn.dataset.min) === settings.min && Number(btn.dataset.max) === settings.max;
      btn.setAttribute("aria-pressed", String(on));
      if (on) matched = true;
    });
    customChip.setAttribute("aria-pressed", String(settings.custom || !matched));
    customRange.hidden = !(settings.custom || !matched);
    if (settings.custom) { customMin.value = settings.min; customMax.value = settings.max; }
  }

  function renderStats() {
    statsEl.textContent = "Richtig: " + stats.solved + " · Serie: " + stats.streak;
  }

  function renderSlots() {
    var slots = slotsEl.children;
    for (var i = 0; i < slots.length; i++) {
      slots[i].textContent = entry[i] || "";
    }
  }

  function clearMarks() {
    Array.prototype.forEach.call(slotsEl.children, function (s) {
      s.classList.remove("wrong", "ok");
    });
  }

  function newProblem() {
    var span = settings.max - settings.min;
    correct = settings.min + Math.floor(Math.random() * (span + 1));
    if (settings.op === "+") {
      a = Math.floor(Math.random() * (correct + 1));
      b = correct - a;
    } else {
      b = Math.floor(Math.random() * (settings.max - correct + 1));
      a = correct + b;
    }
    answerStr = String(correct);
    entry = "";
    attempts = 0;
    locked = false;
    problemEl.textContent = a + " " + (settings.op === "+" ? "+" : "−") + " " + b + " =";
    slotsEl.innerHTML = "";
    for (var i = 0; i < answerStr.length; i++) {
      var slot = document.createElement("span");
      slot.className = "slot";
      slotsEl.appendChild(slot);
    }
    feedbackEl.textContent = "";
    nextBtn.hidden = true;
  }

  function hint() {
    if (settings.op === "+") {
      var large = Math.max(a, b), small = Math.min(a, b);
      return "Tipp: Beginne bei " + large + " und zähle " + small + " weiter.";
    }
    return "Tipp: Beginne bei " + a + " und zähle " + b + " zurück.";
  }

  function evaluate() {
    if (entry === answerStr) {
      locked = true;
      Array.prototype.forEach.call(slotsEl.children, function (s) { s.classList.add("ok"); });
      feedbackEl.textContent = "Richtig. " + a + " " + (settings.op === "+" ? "+" : "−") + " " + b + " = " + correct + ".";
      stats.solved++;
      stats.streak++;
      save();
      renderStats();
      nextBtn.hidden = false;
      nextBtn.focus();
      return;
    }
    attempts++;
    for (var i = 0; i < answerStr.length; i++) {
      if (entry[i] !== answerStr[i]) slotsEl.children[i].classList.add("wrong");
    }
    if (attempts === 1) {
      feedbackEl.textContent = "Fast. Versuch es noch einmal.";
    } else if (attempts === 2) {
      feedbackEl.textContent = "Fast. " + hint();
    } else {
      locked = true;
      entry = answerStr;
      renderSlots();
      clearMarks();
      feedbackEl.textContent = "Die Lösung ist " + correct + ". Schau sie dir an und mach dann weiter.";
      stats.streak = 0;
      save();
      renderStats();
      nextBtn.hidden = false;
      nextBtn.focus();
    }
  }

  function pressDigit(d) {
    if (locked || quizEl.hidden) return;
    if (entry.length >= answerStr.length) return;
    clearMarks();
    entry += d;
    renderSlots();
    if (entry.length === answerStr.length) evaluate();
  }

  function backspace() {
    if (locked || quizEl.hidden) return;
    clearMarks();
    entry = entry.slice(0, -1);
    renderSlots();
  }

  function showSetup() {
    quizEl.hidden = true;
    setupEl.hidden = false;
    instructionEl.textContent = "Wähle Rechenart und Zahlenbereich.";
    reflectSettings();
  }

  function showQuiz() {
    setupEl.hidden = true;
    quizEl.hidden = false;
    instructionEl.textContent = "Rechne die Aufgabe und tippe die Antwort ein.";
    renderStats();
    newProblem();
  }

  opChips.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-op]");
    if (!btn) return;
    settings.op = btn.dataset.op;
    reflectSettings();
  });

  rangeChips.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (btn === customChip) {
      settings.custom = true;
    } else {
      settings.custom = false;
      settings.min = Number(btn.dataset.min);
      settings.max = Number(btn.dataset.max);
    }
    formError.textContent = "";
    reflectSettings();
  });

  startBtn.addEventListener("click", function () {
    if (settings.custom || customChip.getAttribute("aria-pressed") === "true") {
      var min = parseInt(customMin.value, 10);
      var max = parseInt(customMax.value, 10);
      if (isNaN(min) || isNaN(max) || min < 0 || max > 1000 || min > max) {
        formError.textContent = "Bitte einen gültigen Bereich wählen. Von darf nicht grösser als Bis sein.";
        return;
      }
      settings.custom = true;
      settings.min = min;
      settings.max = max;
    }
    formError.textContent = "";
    save();
    showQuiz();
  });

  document.getElementById("change-settings").addEventListener("click", showSetup);

  keypadEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    if (btn.id === "backspace") backspace();
    else if (btn.dataset.digit) pressDigit(btn.dataset.digit);
  });

  nextBtn.addEventListener("click", newProblem);

  document.addEventListener("keydown", function (e) {
    if (quizEl.hidden) return;
    if (e.key >= "0" && e.key <= "9") { pressDigit(e.key); }
    else if (e.key === "Backspace") { backspace(); e.preventDefault(); }
    else if (e.key === "Enter" && !nextBtn.hidden) { newProblem(); }
  });

  reflectSettings();
  renderStats();
})();
</script>
</body>
</html>
